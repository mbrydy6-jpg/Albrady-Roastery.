<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title> Albrady Roastery| محمصة البريدي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --deep-brown: #2d1b0d;
            --gold-leaf: #d4af37;
            --soft-cream: #fef7e8;
            --white: #ffffff;
            --green-tag: #2d6a4f;
        }
        body {
            font-family: 'Amiri', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--soft-cream);
            color: var(--deep-brown);
        }
        header {
            text-align: center;
            padding: 70px 20px;
            background: linear-gradient(rgba(30, 18, 8, 0.85), rgba(30, 18, 8, 0.85)), 
                        url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=1500&auto=format&fit=crop');
            background-size: cover;
            background-position: center 30%;
            border-bottom: 4px solid var(--gold-leaf);
        }
        .logo-title {
            font-size: 4rem;
            font-style: italic;
            font-weight: 900;
            color: var(--gold-leaf);
            margin: 0;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.3);
        }
        .highlight-desc {
            max-width: 750px;
            margin: 20px auto 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            border-right: 6px solid var(--gold-leaf);
            padding: 14px 28px;
            border-radius: 60px;
            display: inline-block;
        }
        .description { font-size: 1.3rem; color: #fff5e6; font-weight: 500; }
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 20px 25px;
            background: var(--deep-brown);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
        }
        .nav-btn {
            background: rgba(45,27,13,0.8);
            border: 1px solid var(--gold-leaf);
            color: var(--gold-leaf);
            padding: 8px 26px;
            cursor: pointer;
            font-size: 1.1rem;
            border-radius: 40px;
            transition: all 0.25s;
            font-weight: bold;
        }
        .nav-btn:hover, .nav-btn.active {
            background: var(--gold-leaf);
            color: var(--deep-brown);
            transform: translateY(-3px);
        }
        .search-section {
            background: linear-gradient(135deg, #3a281c, #2d1b0d);
            padding: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .search-container { position: relative; width: 100%; max-width: 500px; }
        .search-toggle-btn {
            width: 100%;
            background: rgba(255,255,255,0.15);
            border: 1px solid var(--gold-leaf);
            color: var(--gold-leaf);
            font-size: 1.2rem;
            padding: 14px 24px;
            border-radius: 60px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }
        .search-input-active {
            width: 100%;
            padding: 14px 24px;
            font-size: 1.1rem;
            border-radius: 60px;
            border: 2px solid var(--gold-leaf);
            background: white;
            outline: none;
            font-family: inherit;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .search-close {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.3rem;
            color: #999;
            cursor: pointer;
        }
        /* شبكة 2 أعمدة مرنة مع تمرير أفقي في الشاشات الضيقة */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(200px, 1fr));
            gap: 32px;
            padding: 45px 35px;
            overflow-x: auto;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }
        .products-grid[data-cat="mwalh"] { background: radial-gradient(circle at 10% 20%, rgba(245,225,190,0.3), rgba(210,170,100,0.1)), url('https://images.unsplash.com/photo-1598977127919-6d61f3c6e6c8?q=80&w=2070&auto=format&fit=crop'); background-blend-mode: overlay; background-size: cover; }
        .products-grid[data-cat="nuts"] { background: radial-gradient(circle at 80% 10%, rgba(200,150,80,0.2), rgba(100,60,20,0.15)), url('https://images.unsplash.com/photo-1598977127919-6d61f3c6e6c8?q=80&w=2070&auto=format&fit=crop'); background-size: cover; }
        .products-grid[data-cat="coffee"] { background: radial-gradient(circle at 30% 70%, rgba(110,60,20,0.2), rgba(40,20,5,0.2)), url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=1500&auto=format&fit=crop'); background-size: cover; }
        .products-grid[data-cat="host"] { background: radial-gradient(ellipse at 20% 40%, rgba(230,190,120,0.25), rgba(80,45,15,0.1)), url('https://images.unsplash.com/photo-1598977127919-6d61f3c6e6c8?q=80&w=2070&auto=format&fit=crop'); background-size: cover; }
        .products-grid[data-cat="special"] { background: radial-gradient(circle at 70% 80%, rgba(180,130,70,0.2), rgba(0,0,0,0.1)), url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=1500&auto=format&fit=crop'); background-size: cover; }
        .products-grid[data-cat="dates"] { background: radial-gradient(circle at 30% 40%, rgba(160,110,60,0.2), rgba(90,50,20,0.1)), url('https://images.unsplash.com/photo-1598977127919-6d61f3c6e6c8?q=80&w=2070&auto=format&fit=crop'); background-size: cover; }
        .products-grid[data-cat="biscuit"] { background: radial-gradient(circle at 50% 50%, rgba(210,170,100,0.2), rgba(140,90,40,0.1)), url('https://images.unsplash.com/photo-1598977127919-6d61f3c6e6c8?q=80&w=2070&auto=format&fit=crop'); background-size: cover; }
        .products-grid[data-cat="chips"] { background: radial-gradient(circle at 20% 80%, rgba(200,120,50,0.2), rgba(100,60,20,0.1)), url('https://images.unsplash.com/photo-1598977127919-6d61f3c6e6c8?q=80&w=2070&auto=format&fit=crop'); background-size: cover; }
        .product-item {
            background: rgba(255, 250, 240, 0.95);
            backdrop-filter: blur(2px);
            border-radius: 28px;
            overflow: hidden;
            transition: 0.25s ease;
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
            border: 1px solid rgba(212, 175, 55, 0.5);
            position: relative;
            min-width: 0; /* يسمح بالانضغاط ضمن الشبكة */
        }
        .product-item:hover { transform: translateY(-8px); box-shadow: 0 20px 28px rgba(0,0,0,0.2); background: white; }
        .product-item img { width: 100%; height: 220px; object-fit: cover; }
        .status-tag {
            position: absolute; top: 12px; left: 12px;
            background: var(--green-tag); color: white; padding: 4px 14px; border-radius: 40px;
            font-weight: bold; font-size: 0.7rem; z-index: 2;
        }
        .product-info { padding: 18px; text-align: center; }
        .product-info h3 { font-size: 1.35rem; margin-bottom: 8px; }
        .price-tag { color: #b45f2b; font-weight: bold; font-size: 1.1rem; margin: 8px 0; }
        .cart-btn {
            background: var(--gold-leaf); border: none; color: #2d1b0d; padding: 10px 0;
            border-radius: 60px; font-weight: bold; cursor: pointer; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.2s; font-size: 0.95rem;
        }
        .cart-btn:hover { background: #e6b422; transform: scale(0.98); }
        .contact-float {
            position: fixed; bottom: 28px; right: 28px; display: flex; flex-direction: column; gap: 18px; z-index: 9999;
        }
        .icon-link {
            width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 2rem; text-decoration: none; transition: 0.25s; box-shadow: 0 5px 12px rgba(0,0,0,0.3);
            position: relative;
        }
        .wa { background: #25d366; }
        .ig { background: #e1306c; }
        .cart-float-icon { background: #b87333; cursor: pointer; }
        .icon-link:hover { transform: scale(1.08); }
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #e1306c;
            color: white;
            font-size: 12px;
            font-weight: bold;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cart-sidebar {
            position: fixed; left: -420px; top: 0; width: 400px; height: 100vh;
            background: #fef7e8; z-index: 2000; box-shadow: -6px 0 28px rgba(0,0,0,0.4);
            transition: left 0.35s cubic-bezier(0.2,0.9,0.4,1.1);
            display: flex; flex-direction: column;
            border-left: 5px solid var(--gold-leaf);
        }
        .cart-sidebar.open { left: 0; }
        .cart-header {
            background: #4a3422; color: #f9e2b7; padding: 22px;
            display: flex; justify-content: space-between;
            align-items: center; border-bottom: 2px solid #d4af37;
        }
        .cart-header h3 { font-size: 1.7rem; }
        .close-cart { background: none; border: none; font-size: 1.8rem; color: #f9e2b7; cursor: pointer; }
        .cart-items-list { flex: 1; overflow-y: auto; padding: 20px; background: #fef7e8; }
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #e2cba4; padding: 14px 0; color: #3a2a1c;
        }
        .remove-item { color: #c97e5a; cursor: pointer; margin-right: 12px; }
        .cart-total {
            padding: 18px; background: #e9dbc9; font-weight: bold; font-size: 1.4rem;
            color: #2c1b0c; border-top: 2px solid #c5a059; text-align: center;
        }
        .cart-footer { padding: 22px; background: #f5ebdb; display: flex; flex-direction: column; gap: 12px; }
        .customer-input, .branch-select {
            width: 100%; padding: 12px; border-radius: 50px;
            border: 1px solid var(--gold-leaf); background: white;
            font-family: 'Tajawal', sans-serif; outline: none;
        }
        .location-btn {
            background: #2c3e50; color: white; border: none;
            padding: 10px; border-radius: 50px; cursor: pointer;
            font-size: 0.9rem; display: flex; align-items: center;
            justify-content: center; gap: 8px; transition: 0.2s;
        }
        .location-btn:hover { background: #1a2a3a; transform: scale(0.98); }
        .button-group { display: flex; gap: 12px; margin-top: 5px; }
        .clear-cart-btn {
            background: #b85c3a; color: white; flex: 1; padding: 12px;
            border-radius: 50px; font-weight: bold; cursor: pointer;
            border: none; transition: 0.2s;
        }
        .send-order-btn {
            background: #2d6a4f; color: white; flex: 1; padding: 12px;
            border-radius: 50px; font-weight: bold; cursor: pointer;
            border: none; transition: 0.2s;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #fff7ed;
            padding: 30px 40px;
            border-radius: 100px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
            border: 3px solid var(--gold-leaf);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .modal-content h3 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            color: var(--deep-brown);
        }
        .quantity-stepper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 10px 0 15px 0;
            flex-wrap: wrap;
        }
        .stepper-btn {
            background: var(--gold-leaf);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stepper-btn:hover {
            background: #e6b422;
            transform: scale(1.05);
        }
        .stepper-btn.hidden {
            display: none;
        }
        .quantity-input {
            width: 140px;
            padding: 15px;
            font-size: 1.5rem;
            text-align: center;
            border-radius: 60px;
            border: 2px solid var(--gold-leaf);
            background: white;
            font-family: inherit;
            outline: none;
        }
        .quantity-input.wide {
            width: 200px;
        }
        .modal-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 10px;
        }
        .modal-buttons button {
            padding: 12px 35px;
            border-radius: 50px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }
        .modal-buttons button:first-child {
            background: var(--gold-leaf);
            color: var(--deep-brown);
        }
        .modal-buttons button:last-child {
            background: #ddd;
            color: #333;
        }
        .toast-modern {
            position: fixed;
            top: 25px;
            right: 25px;
            background: linear-gradient(135deg, #2d6a4f, #1f543e);
            color: #fff7e8;
            padding: 14px 28px;
            border-radius: 50px;
            z-index: 10000;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            backdrop-filter: blur(6px);
            border-right: 4px solid var(--gold-leaf);
            animation: slideInRight 0.3s ease-out forwards, fadeOut 0.4s ease-in 2s forwards;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast-modern.error {
            background: linear-gradient(135deg, #b85c3a, #9a4528);
        }
        @keyframes slideInRight {
            0% { transform: translateX(100px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }
        .success-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 20000;
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .success-content {
            background: linear-gradient(135deg, #2d6a4f, #1f543e);
            padding: 50px 60px;
            border-radius: 80px;
            text-align: center;
            color: white;
            animation: bounceIn 0.5s ease;
            border: 3px solid var(--gold-leaf);
        }
        .success-content i { font-size: 5rem; margin-bottom: 20px; }
        .success-content h2 { font-size: 2rem; margin-bottom: 10px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        footer { text-align: center; padding: 25px; background: var(--deep-brown); color: var(--gold-leaf); }
        @media (max-width:600px) { 
            .cart-sidebar { width: 100%; left: -100%; }
            .products-grid { padding: 25px 15px; gap: 20px; }
            .modal-content { padding: 25px 20px; border-radius: 60px; }
            .stepper-btn { width: 50px; height: 50px; font-size: 1.2rem; }
            .quantity-input { width: 110px; font-size: 1.2rem; }
        }
        /* إخفاء الأيقونات العائمة عند فتح السلة */
.contact-float.hide {
    display: none;
}
    </style>
</head>
<body>

    // دوال الصوت
    function playAddSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.value = 880;
            gainNode.gain.value = 0.3;
            oscillator.type = 'sine';
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
            oscillator.stop(audioCtx.currentTime + 0.5);
            if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch(e) { console.log("Audio error", e); }
    }

            (error) => { console.log("لم يتم مشاركة الموقع تلقائياً"); }
        );
    }

    function updateCartBadge() {
        let totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        const badge = document.getElementById('cartBadge');
        if (badge) badge.innerText = totalItems;
    }

    function showToast(message, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast-modern';
        if (isError) toast.classList.add('error');
        toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2600);
    }

    function showSuccessMessage() {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'success-modal';
        modalDiv.innerHTML = `
            <div class="success-content">
                <i class="fas fa-check-circle"></i>
                <h2>✅ سيصل طلبك قريباً</h2>
                <p>شكراً لتسوقكم من محمصة البريدي</p>
                <button onclick="this.parentElement.parentElement.remove()" style="background: var(--gold-leaf); color: #2d1b0d; border: none; padding: 10px 30px; border-radius: 50px; margin-top: 20px; cursor: pointer;">إغلاق</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        setTimeout(() => { if (modalDiv) modalDiv.remove(); }, 5000);
    }

    document.getElementById('getLocationBtn').addEventListener('click', () => {
        if (!navigator.geolocation) { showToast("⚠️ متصفحك لا يدعم مشاركة الموقع", true); return; }
        showToast("📡 جاري الحصول على موقعك...");
        navigator.geolocation.getCurrentPosition(
            (position) => { userLocation = { lat: position.coords.latitude, lng: position.coords.longitude }; showToast(`📍 تم إضافة موقعك`); },
            (error) => { showToast("❌ لم نتمكن من الحصول على موقعك", true); }
        );
    });

    function renderCartUI() {
        const container = document.getElementById('cartItemsList');
        if (cart.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px;">السلة فارغة 🛒</div>';
            document.getElementById('cartTotal').innerHTML = 'الإجمالي: 0 ل.س';
            updateCartBadge();
            return;
        }
        let html = '';
        let total = 0;
        cart.forEach((item, idx) => {
            const prod = item.product;
            const qty = item.quantity;
            const price = prod.price;
            const unit = item.unitType;
            const itemTotal = price * qty;
            total += itemTotal;
            let qtyDisplay = (unit === "كيلو") ? qty.toFixed(2) + " كيلو" : qty + " قطعة";
            html += `<div class="cart-item">
                        <div class="cart-item-details"><strong>${prod.name}</strong><br>${qtyDisplay} × ${price.toLocaleString()} ل.س = ${itemTotal.toLocaleString()} ل.س</div>
                        <div><span class="remove-item" data-idx="${idx}"><i class="fas fa-trash-alt"></i></span></div>
                    </div>`;
        });
        container.innerHTML = html;
        document.getElementById('cartTotal').innerHTML = `الإجمالي: ${total.toLocaleString()} ل.س`;
        updateCartBadge();
        document.querySelectorAll('.remove-item').forEach(el => {
            el.addEventListener('click', (e) => {
                let idx = parseInt(el.dataset.idx);
                cart.splice(idx, 1);
                renderCartUI();
                saveCartWithExpiry();
                showToast('🗑️ تم حذف المنتج من السلة');
            });
        });
    }

    function clearFullCart() {
        if (cart.length === 0) { showToast('⚠️ السلة فارغة بالفعل', true); return; }
        cart = [];
        renderCartUI();
        saveCartWithExpiry();
        showToast('🗑️ تم إلغاء الطلب بالكامل');
    }

    function saveCartWithExpiry() {
        const cartData = { items: cart, expiry: Date.now() + 86400000 };
        localStorage.setItem('coffeeCart', JSON.stringify(cartData));
    }

    function loadCartWithExpiry() {
        let saved = localStorage.getItem('coffeeCart');
        if (saved) {
            try {
                const cartData = JSON.parse(saved);
                if (cartData.expiry && Date.now() < cartData.expiry) { cart = cartData.items || []; }
                else { localStorage.removeItem('coffeeCart'); cart = []; }
            } catch(e) { cart = []; }
        } else { cart = []; }
        renderCartUI();
    }

    // دالة مودال الكمية مع فتح الكيبورد تلقائياً (إزالة readOnly وجلب التركيز)
    function openQuantityModal(product, unitType) {
        currentModalProduct = product;
        currentUnit = unitType;
        document.getElementById('modalProductName').innerText = product.name;
        const qtyInput = document.getElementById('quantityInput');
        const decBtn = document.getElementById('decQtyBtn');
        const incBtn = document.getElementById('incQtyBtn');
        // جعل الحقل قابل للتحرير فوراً وفتح الكيبورد
        qtyInput.readOnly = false;
        qtyInput.style.backgroundColor = "white";
        qtyInput.placeholder = "";
        if (unitType === "كيلو") {
            qtyInput.value = "0.5";
            qtyInput.step = "0.01";
            qtyInput.min = "0.05";
            decBtn.style.display = "flex";
            incBtn.style.display = "flex";
            qtyInput.classList.remove('wide');
            qtyInput.onclick = null;
        } else {
            qtyInput.value = "1";
            qtyInput.step = "1";
            qtyInput.min = "1";
            decBtn.style.display = "none";
            incBtn.style.display = "none";
            qtyInput.classList.add('wide');
            qtyInput.oninput = function() { let val = parseInt(this.value); if (isNaN(val) || val < 1) val = 1; this.value = val; };
        }
        document.getElementById('quantityModal').style.display = 'flex';
        // التركيز لفتح الكيبورد (على الجوال)
        setTimeout(() => {
            qtyInput.focus();
            qtyInput.select();
        }, 100);
    }

    document.getElementById('incQtyBtn').onclick = () => {
        let input = document.getElementById('quantityInput');
        let val = parseFloat(input.value);
        if (isNaN(val)) val = 0;
        val = Math.round((val + 0.1) * 100) / 100;
        input.value = val;
    };
    document.getElementById('decQtyBtn').onclick = () => {
        let input = document.getElementById('quantityInput');
        let val = parseFloat(input.value);
        if (isNaN(val)) val = 0;
        if (val > 0.1) val = Math.round((val - 0.1) * 100) / 100;
        input.value = val;
    };
    document.getElementById('confirmQtyBtn').onclick = () => {
        let qty = parseFloat(document.getElementById('quantityInput').value);
        if (isNaN(qty)) qty = (currentUnit === "كيلو") ? 0.5 : 1;
        if (currentUnit === "كيلو") {
            if (qty < 0.05) qty = 0.05;
            qty = Math.round(qty * 100) / 100;
        } else {
            qty = Math.round(qty);
            if (qty < 1) qty = 1;
        }
        let existing = cart.find(i => i.product.name === currentModalProduct.name && i.unitType === currentUnit);
        if (existing) existing.quantity += qty;
        else cart.push({ product: currentModalProduct, quantity: qty, unitType: currentUnit });
        renderCartUI();
        saveCartWithExpiry();
        let qtyDisplay = (currentUnit === "كيلو") ? qty.toFixed(2) + " كيلو" : qty + " قطعة";
        showToast(`✨ تم إضافة ${qtyDisplay} من ${currentModalProduct.name}`);
        playAddSound();
        document.getElementById('quantityModal').style.display = 'none';
        const qtyInput = document.getElementById('quantityInput');
        qtyInput.onclick = null;
        qtyInput.oninput = null;
        qtyInput.readOnly = false;
    };
    document.getElementById('cancelModalBtn').onclick = () => {
        document.getElementById('quantityModal').style.display = 'none';
        const qtyInput = document.getElementById('quantityInput');
        qtyInput.onclick = null; qtyInput.oninput = null; qtyInput.readOnly = false;
    };
    window.onclick = (e) => { if (e.target === document.getElementById('quantityModal')) {
        document.getElementById('quantityModal').style.display = 'none';
        const qtyInput = document.getElementById('quantityInput');
        qtyInput.onclick = null; qtyInput.oninput = null; qtyInput.readOnly = false;
    }};

    // عرض المنتجات مع البحث العام
    function renderProducts() {
        const grid = document.getElementById('main-grid');
        let productsToShow = [];
        if (searchKeyword.trim() !== "") {
            productsToShow = allProducts.filter(p => p.name.toLowerCase().includes(searchKeyword.toLowerCase()));
            isSearchActive = true;
        } else {
            productsToShow = productsDB[currentTab] || [];
            isSearchActive = false;
        }
        if (productsToShow.length === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px;">🔍 لا توجد منتجات مطابقة</div>';
            return;
        }
        grid.innerHTML = '';
        productsToShow.forEach(prod => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'product-item';
            itemDiv.innerHTML = `
                <div class="status-tag">${prod.available ? "متوفر" : "غير متوفر"}</div>
                <img src="${prod.image}" onerror="this.src='https://placehold.co/400x300?text=صورة'">
                <div class="product-info">
                    <h3>${prod.name}</h3>
                    <div class="price-tag">${prod.price.toLocaleString()} ل.س / ${prod.unit}</div>
                    <button class="cart-btn"><i class="fas fa-shopping-cart"></i> أضف للسلة</button>
                </div>`;
            grid.appendChild(itemDiv);
            const btn = itemDiv.querySelector('.cart-btn');
            btn.addEventListener('click', () => {
                if (!prod.available) { showToast('🚫 غير متوفر', true); return; }
                openQuantityModal(prod, prod.unit);
            });
        });
    }

    function loadTab(tab, btnElement) {
        if (isSearchActive && searchKeyword.trim() !== "") {
            closeSearch();
        }
        currentTab = tab;
        searchKeyword = '';
        const searchInput = document.getElementById('searchInputActive');
        if (searchInput) searchInput.value = '';
        renderProducts();
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        document.getElementById('main-grid').setAttribute('data-cat', tab);
    }

    const searchContainer = document.getElementById('searchContainer');
    let isSearchOpen = false;
    function openSearch() {
        if (isSearchOpen) return;
        isSearchOpen = true;
        searchContainer.innerHTML = `<input type="text" id="searchInputActive" class="search-input-active" placeholder="ابحث عن منتج في كل الأقسام"><button class="search-close" id="searchCloseBtn"><i class="fas fa-times"></i></button>`;
        const newInput = document.getElementById('searchInputActive');
        const closeBtn = document.getElementById('searchCloseBtn');
        newInput.focus();
        newInput.addEventListener('input', (e) => {
            searchKeyword = e.target.value.trim();
            renderProducts();
        });
        closeBtn.addEventListener('click', closeSearch);
    }
    function closeSearch() {
        if (!isSearchOpen) return;
        isSearchOpen = false;
        searchKeyword = '';
        isSearchActive = false;
        renderProducts();
        searchContainer.innerHTML = `<button class="search-toggle-btn" id="searchToggleBtn"><span><i class="fas fa-search"></i> اضغط للبحث عن منتج</span><i class="fas fa-chevron-down"></i></button>`;
        document.getElementById('searchToggleBtn').addEventListener('click', openSearch);
        const activeBtn = document.querySelector('.nav-btn.active');
        if (activeBtn) {
            currentTab = activeBtn.getAttribute('data-tab');
            renderProducts();
            document.getElementById('main-grid').setAttribute('data-cat', currentTab);
        }
    }
   
    document.getElementById('searchToggleBtn').addEventListener('click', openSearch);
   const cartSidebar = document.getElementById('cartSidebar');
const floatIcons = document.querySelector('.contact-float');

document.getElementById('openCartFloating').addEventListener('click', () => {
    cartSidebar.classList.add('open');
    if (floatIcons) floatIcons.classList.add('hide');
});
document.getElementById('closeCartBtn').addEventListener('click', () => {
    cartSidebar.classList.remove('open');
    if (floatIcons) floatIcons.classList.remove('hide');
});
    document.getElementById('clearCartBtn').addEventListener('click', clearFullCart);

    function sendToGoogleSheets(data) { } // معطل

    document.getElementById('sendOrderBtn').addEventListener('click', () => {
        let customer = document.getElementById('customerName').value.trim();
        if (!customer) { showToast('✏️ يرجى إدخال الاسم الكريم', true); return; }
        let branchValue = document.getElementById('branchSelect').value;
        if (!branchValue) { showToast('📍 يرجى تحديد فرع الاستلام', true); return; }
        let branchParts = branchValue.split('|');
        let branchName = branchParts[0];
        let branchPhone = branchParts[1];
        if (cart.length === 0) { showToast('🛒 السلة فارغة', true); return; }
        let total = cart.reduce((s, i) => s + (i.product.price * i.quantity), 0);
        let finalLocation = userLocation || autoLocation;
        let msg = ` طلب جديد من ${customer}\n الفرع: ${branchName}\n`;
        if (finalLocation) msg += ` الموقع: https://maps.google.com/?q=${finalLocation.lat},${finalLocation.lng}\n`;
        msg += `\n المنتجات:\n${cart.map(i => `• ${i.product.name} : ${(i.unitType === "كيلو" ? i.quantity.toFixed(2) : i.quantity)} ${i.unitType} × ${i.product.price.toLocaleString()} = ${(i.product.price * i.quantity).toLocaleString()} ل.س`).join('\n')}\n\n💰 الإجمالي: ${total.toLocaleString()} ل.س`;
        window.open(`https://wa.me/${branchPhone}?text=${encodeURIComponent(msg)}`, '_blank');
        showSuccessMessage();
        cart = [];
        renderCartUI();
        saveCartWithExpiry();
        userLocation = null;
    });

    const nameField = document.getElementById('customerName');
    nameField.addEventListener('focus', () => { if (nameField.value === '') nameField.placeholder = ''; });
    nameField.addEventListener('blur', () => { if (nameField.value === '') nameField.placeholder = 'ادخل الاسم الكريم'; });
    document.querySelectorAll('.nav-btn').forEach(btn => { btn.addEventListener('click', (e) => loadTab(btn.dataset.tab, btn)); });

    loadCartWithExpiry();
    loadTab('mwalh', document.querySelector('.nav-btn.active'));
</script>
